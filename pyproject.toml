[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attestarc-skill"
version = "0.4.0"
description = "Installable software supply-chain security Agent Skill for Claude Code and Cursor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# No runtime dependencies: helper scripts are stdlib-only by design.
dependencies = []

[project.optional-dependencies]
# The shipped skill and its helpers are stdlib-only. These are DEV-ONLY tools:
# pytest to run the suite, and PyYAML solely so the differential parser test can
# cross-check the hand-written stdlib workflow parser against a reference YAML
# implementation. PyYAML is never imported by any shipped helper; tests that use
# it skip cleanly when it is absent.
dev = ["pytest>=7", "PyYAML>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = ["install", "uninstall"]
