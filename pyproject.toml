[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attestarc-skill"
version = "0.1.0"
description = "Installable software supply-chain security Agent Skill for Claude Code and Cursor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# No runtime dependencies: helper scripts are stdlib-only by design.
dependencies = []

[project.optional-dependencies]
# Test suite runs on the standard library alone; pytest is the only dev tool.
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = ["install", "uninstall"]
