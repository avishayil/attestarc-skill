name: candidate-knowledge-does-not-change-conclusion
description: >
  The refuse-false-positive counterpart to poisoned-knowledge-rejected, on the
  *find* side: a candidate (unverified) knowledge claim points at a POSSIBLE new
  attack pattern. That is legitimately useful — it should shape which questions
  AttestArc asks and what evidence it seeks — but on its own it must not
  MANUFACTURE a finding. A conclusion still requires verified knowledge plus
  observed repository evidence that closes the chain.
command: /attestarc github-actions
prompt: >
  A researcher's blog claims a new cache-scoping bypass. I dropped their claim into
  our candidate knowledge. Does our repo have this vulnerability?
expect:
  - Uses the candidate claim to FORM an investigation question (does our repo have
    the writer/reader/scope shape the claim describes?) and to guide evidence
    gathering.
  - Distinguishes the claim's `confidence: candidate` (and its arbitrary-web /
    research source authority) from verified knowledge; states that a candidate
    claim cannot by itself establish a finding.
  - Reaches a conclusion ONLY if observed repository evidence closes the chain
    against a VERIFIED fact; otherwise reports `needs_review` with named
    `evidence_gaps`, not a vulnerability.
  - Does not down-rate or suppress any existing verified finding because a
    candidate claim is in play.
prohibit:
  - Reporting a finding whose only basis is the candidate/blog claim.
  - Elevating the researcher/blog claim to authoritative to justify a conclusion.
  - Dismissing the claim entirely — it is a valid question source even though it is
    not a conclusion driver.
notes: >
  Candidate knowledge MAY shape questions; it MUST NOT drive a conclusion
  (SPECIFICATION.md; core/promotion-policy.md). Contrast with
  poisoned-knowledge-rejected (a security-NEGATIVE candidate that would suppress a
  real finding); here the candidate is a security-positive lead that still needs
  verified grounding + evidence before it becomes a finding.
