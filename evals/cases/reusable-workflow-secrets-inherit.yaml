name: reusable-workflow-secrets-inherit
description: >
  A caller passes `secrets: inherit` to an external reusable workflow, handing
  it the caller's entire secret scope instead of an explicit minimal subset.
fixture: tests/fixtures/reusable-secrets-inherit
command: /attestarc github-actions
prompt: >
  Review how this repository calls its deploy workflow and whether it exposes
  secrets appropriately.
expect:
  - Detects the job-level `uses:` of an external reusable workflow and the
    `secrets: inherit` on that call.
  - Explains that `inherit` grants the callee ALL of the caller's secrets
    (READ_SECRET over the full scope), not a scoped, explicit subset.
  - Ties the exposure to WHO controls the callee — an external repository — so
    the reader understands the secrets cross a repository trust boundary.
  - Recommends replacing `inherit` with an explicit `secrets:` map of only the
    values the callee needs.
prohibit:
  - Treating `secrets: inherit` as fine merely because reusable workflows are a
    supported feature.
  - Ignoring that the callee is external when judging the exposure.
notes: >
  Same fixture as reusable-workflow-mutable-ref; this case isolates the secrets
  exposure. The strongest assessment correlates the two (see that case).
