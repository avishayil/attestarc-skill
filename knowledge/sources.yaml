# AttestArc source registry — the root of source authority (ROOT OF TRUST).
#
# Authority is assigned HERE, deterministically, never by the model. The Updater
# (scripts/knowledge_compile.py) reclassifies every fetched document's URL against
# this registry to derive its publisher / type / authority; a candidate may not
# declare its own authority. Trust is bound to an exact HTTPS origin AND, for repo
# hosts, to specific org/repo path prefixes — never to a whole domain. A URL that
# is not HTTPS, whose origin is absent, or whose path is outside the trusted
# prefixes is `arbitrary-web` (authority 0): it MUST NOT be fetched by refresh nor
# drive a promotion. Changes to this file require two-party review (see
# core/promotion-policy.md and THREAT_MODEL.md §6).
#
# Format is a deliberately small YAML subset (comments, one `tiers:` mapping of
# type -> integer, and one `allowlist:` list of records with an optional nested
# `path_prefixes:` list) parsed by a scoped stdlib reader — no YAML dependency.

# Authority tiers. Mirrors the enum in schemas/knowledge.schema.json; the two
# MUST agree. Higher = more trusted. Only >= 90 can auto-promote.
tiers:
  vendor-docs: 100
  vendor-changelog: 95
  vendor-repo: 90
  standard: 90
  security-org: 80
  research: 60
  issue: 40
  community: 20
  arbitrary-web: 0

# Fetch/classify allowlist. `origin` is the exact scheme+host (HTTPS only); the
# host must match exactly (no implicit subdomain trust). For repository hosts,
# `path_prefixes` scopes trust to specific first-party orgs/repos — so an
# attacker-controlled repo under the same host (e.g. github.com/attacker/…) is
# NOT vendor-repo authority. A record without `path_prefixes` trusts the whole
# origin (only used for first-party docs/standards hosts).
allowlist:
  - origin: https://docs.github.com
    publisher: GitHub
    type: vendor-docs
  - origin: https://github.blog
    publisher: GitHub
    type: vendor-changelog
  - origin: https://github.com
    publisher: GitHub
    type: vendor-repo
    path_prefixes:
      - /actions/
      - /github/
  - origin: https://raw.githubusercontent.com
    publisher: GitHub
    type: vendor-repo
    path_prefixes:
      - /actions/
      - /github/
  - origin: https://slsa.dev
    publisher: SLSA
    type: standard
  - origin: https://openssf.org
    publisher: OpenSSF
    type: security-org
  - origin: https://best.openssf.org
    publisher: OpenSSF
    type: security-org
  - origin: https://csrc.nist.gov
    publisher: NIST
    type: standard
  - origin: https://www.rfc-editor.org
    publisher: IETF
    type: standard
