name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: third-party/example@v2
        with:
          username: ${{ github.actor }}
      - name: Build
        run: make build
