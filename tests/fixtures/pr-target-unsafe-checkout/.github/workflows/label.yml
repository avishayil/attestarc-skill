name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Dangerous: explicitly re-enables the fork-PR checkout that modern
      # actions/checkout refuses by default, pulling attacker-controlled PR head
      # code into a privileged context with write permissions.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - name: Run project build script from the PR
        run: |
          npm install
          npm run build
