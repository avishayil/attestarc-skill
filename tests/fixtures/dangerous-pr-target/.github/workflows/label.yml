name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Dangerous: checks out attacker-controlled PR head under a privileged
      # trigger with write permissions.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run project build script from the PR
        run: |
          echo "Building PR titled ${{ github.event.pull_request.title }}"
          npm install
          npm run build
