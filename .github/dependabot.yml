version: 2
updates:
  # Keep SHA-pinned GitHub Actions current (pinning without an updater rots).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Dev tooling (pytest) declared in pyproject.toml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
