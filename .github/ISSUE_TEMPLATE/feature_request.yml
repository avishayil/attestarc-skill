name: Feature request
description: Suggest a new capability, reference, or improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AttestArc is an **Agent Skill**, not a standalone scanner. Proposals that
        would turn a deterministic helper into a scanner engine, or add servers,
        databases, dashboards, or agent frameworks, are out of scope — see
        [CLAUDE.md](../blob/main/CLAUDE.md) and
        [SPECIFICATION.md](../blob/main/SPECIFICATION.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The security or usability gap you are hitting, in concrete terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: |
        What you would like AttestArc to do. If it involves reasoning, note
        whether it belongs in `references/` (expertise), `SKILL.md` (workflow),
        or a deterministic helper (facts only).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reasoning / references (methodology, threats, domain expertise)
        - Deterministic helper (facts)
        - Findings schema / state
        - Installer / packaging
        - Documentation / getting-started site
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one is preferable.
    validations:
      required: false
