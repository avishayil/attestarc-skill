name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      # Third-party actions are pinned to a full commit SHA (with the human
      # version in a comment) so a moved tag cannot change what runs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned and hash-locked (see ci-constraints.txt): a moved tag or a
      # compromised re-release cannot change what CI installs. --require-hashes
      # forces every dependency to match a recorded sha256; --only-binary avoids
      # building from an sdist whose hash is not recorded.
      - name: Install dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r ci-constraints.txt
      - name: Run tests (stdlib-only helpers)
        run: python -m pytest
