# Knowledge-plane release + attestation (root-of-trust workflow).
#
# Builds knowledge/manifest.json over knowledge/bootstrap/*.jsonl (monotonic
# version + short TTL, pinning every pack by sha256+size), then attests the
# manifest with GitHub Artifact Attestations (Sigstore build provenance, OIDC).
# The attestation binds the bundle to THIS repo + workflow + issuer — the identity
# scripts/knowledge_verify.py pins in knowledge/trust-anchor.json. There is no
# maintainer signing key and no homemade role-file protocol: trust derives from
# Sigstore provenance, verified locally via `gh attestation verify`.
#
# This workflow is itself a ROOT-OF-TRUST artifact: any change is two-party review
# (core/promotion-policy.md, THREAT_MODEL.md §6). Third-party actions are pinned to
# a full commit SHA. Both the manifest AND the published .tar.gz are self-verified
# with `gh attestation verify` before publishing — it never publishes something it
# could not verify (fail-secure, never sign/publish-then-trust).
#
# Provenance is bound to the CURRENT reviewed head, and bundle vs revocation are
# separated so neither can impersonate the other: (1) an exact-HEAD gate refuses to
# build unless the tagged commit IS the current tip of origin/main — not merely an
# ancestor — so an old reviewed commit cannot be retagged as a higher knowledge
# version (rollback by relabeling); (2) a normal bundle is produced ONLY by a push of
# a knowledge-v* tag and a revocation ONLY by a workflow_dispatch on main, and clients
# verify each against an ARTIFACT-SPECIFIC SAN identity (bundle @refs/tags/knowledge-v<N>,
# revocation @refs/heads/main) pinned in knowledge/trust-anchor.json; and (3) the
# release job runs in the `knowledge-release` environment, whose deployment tag policy
# restricts it to `knowledge-v*` tags. Release tags are immutable and required to be
# signed (knowledge-v* tag ruleset: required_signatures + no force-push/deletion).
# The prev_digest chain is fail-closed: if a prior release exists it MUST be listed,
# downloaded, attestation-verified, and read, or the build refuses to publish.
#
# NOTE: actions/attest-build-provenance is pinned below to v4.2.2
# (4d101475d8b20a2381f78447822ac1eab6504dd8). The maintainer MUST independently
# verify this SHA against the upstream release in the two-party review that gates
# changes to this file before enabling the workflow.

name: release-knowledge

on:
  push:
    tags: ["knowledge-v*"]
  workflow_dispatch:
    inputs:
      revoke_version:
        description: "Publish a revocation for this knowledge version (kill switch). Leave empty for a normal release."
        required: false
        default: ""

# Least privilege. id-token:write is required for Sigstore/OIDC provenance;
# attestations:write records the attestation; contents:write publishes the asset.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-publish:
    # A normal knowledge bundle is produced ONLY by a push of a knowledge-v* tag —
    # never from a workflow_dispatch on a branch. This, plus the per-artifact
    # identity in trust-anchor.json (bundles must be signed from refs/tags/knowledge-v*),
    # stops a bundle being minted off main.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/knowledge-v') }}
    runs-on: ubuntu-latest
    # Protected release environment: its deployment tag policy restricts this job to
    # `knowledge-v*` tags, so the attest+publish path cannot run from an arbitrary ref
    # even if the trigger were widened. (Environment REQUIRED-REVIEWER approval is not
    # set here because a single-maintainer repo cannot self-approve; the ancestry gate
    # and ref-bound identity are the enforceable controls — THREAT_MODEL.md §4/§6.)
    environment: knowledge-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the ancestry gate can prove the tagged commit is
          # contained in origin/main.
          fetch-depth: 0

      - name: Bind to current reviewed head (exact-HEAD gate)
        run: |
          # Refuse unless the tagged commit is the CURRENT tip of origin/main — not
          # merely an ancestor. An ancestor gate would let a historically-reviewed
          # but obsolete commit be retagged as a higher knowledge version (rollback
          # by relabeling). Requiring the exact head means a knowledge-v* tag can
          # only release the state main currently points at.
          # Operational note: if main advances between tagging and this run, delete
          # and recreate the tag on the new head (the knowledge-v* tag ruleset keeps
          # tags immutable+signed; moving one needs the maintainer).
          git fetch --no-tags origin main:refs/remotes/origin/main
          HEAD_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$GITHUB_SHA" != "$HEAD_SHA" ]; then
            echo "::error::tagged commit $GITHUB_SHA is not the current origin/main tip ($HEAD_SHA); refusing to sign a stale release"
            exit 1
          fi
          echo "exact-HEAD gate passed: $GITHUB_SHA is the current origin/main tip"

      - name: Build manifest over the packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, glob, datetime, re, subprocess, tarfile, tempfile
          root = "knowledge"
          ref = os.environ.get("GITHUB_REF_NAME", "")
          version = int(ref.split("knowledge-v")[-1]) if "knowledge-v" in ref else 1
          now = datetime.datetime.now(datetime.timezone.utc)
          created = now.strftime("%Y-%m-%dT00:00:00Z")
          # Short TTL (90 days): a frozen download past this is rejected by the
          # client (freeze protection); the in-package snapshot only warns.
          expires = (now + datetime.timedelta(days=90)).strftime("%Y-%m-%dT00:00:00Z")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  h.update(fh.read())
              return h.hexdigest()

          # prev_digest chains this manifest to the immediately-preceding release's
          # manifest bytes (the sha256 the client records as its high-water head). It
          # is a forward integrity chain; the primary anti-rollback remains the
          # client's monotonic highest-version memory. It is null ONLY when no prior
          # knowledge-v* release exists. FAIL-CLOSED: if a prior release exists but we
          # cannot list it, download it, authenticate its attestation, or read its
          # manifest, we refuse to publish rather than emit a null (which a client
          # would read as "first install" and skip chain validation).
          def _die(msg):
              raise SystemExit(f"prev_digest: {msg}; refusing to publish")

          def previous_manifest_digest(cur_version):
              server = os.environ["GITHUB_SERVER_URL"]
              repo = os.environ["GITHUB_REPOSITORY"]
              issuer = "https://token.actions.githubusercontent.com"
              try:
                  out = subprocess.run(
                      ["gh", "release", "list", "--limit", "200",
                       "--json", "tagName", "-q", ".[].tagName"],
                      capture_output=True, text=True, check=True).stdout
              except (OSError, subprocess.SubprocessError) as exc:
                  _die(f"release list failed ({exc})")
              prior = []
              for line in out.splitlines():
                  m = re.match(r"^knowledge-v(\d+)$", line.strip())
                  if m and int(m.group(1)) < cur_version:
                      prior.append((int(m.group(1)), line.strip()))
              if not prior:
                  print("prev_digest: no prior release; using null (first release)")
                  return None
              _, ptag = max(prior)
              with tempfile.TemporaryDirectory() as td:
                  try:
                      subprocess.run(["gh", "release", "download", ptag,
                                      "-p", "*.tar.gz", "-D", td], check=True)
                  except (OSError, subprocess.SubprocessError) as exc:
                      _die(f"download {ptag} failed ({exc})")
                  tars = glob.glob(os.path.join(td, "*.tar.gz"))
                  if not tars:
                      _die(f"{ptag} has no .tar.gz asset")
                  # Authenticate the prior archive BEFORE trusting its bytes: it must
                  # carry a bundle attestation from that tag's ref. The chain head we
                  # record must be an authenticated digest, not any bytes a mirror served.
                  ident = (f"{server}/{repo}/.github/workflows/"
                           f"release-knowledge.yml@refs/tags/{ptag}")
                  try:
                      subprocess.run(
                          ["gh", "attestation", "verify", tars[0], "--repo", repo,
                           "--cert-identity", ident, "--cert-oidc-issuer", issuer],
                          check=True)
                  except (OSError, subprocess.SubprocessError) as exc:
                      _die(f"attestation verify of {ptag} archive failed ({exc})")
                  with tarfile.open(tars[0]) as tf:
                      member = next(
                          (m for m in tf.getmembers()
                           if m.name.endswith("knowledge/manifest.json")
                           or os.path.basename(m.name) == "manifest.json"), None)
                      if member is None:
                          _die(f"{ptag} archive has no manifest.json")
                      data = tf.extractfile(member).read()
              digest = hashlib.sha256(data).hexdigest()
              print(f"prev_digest: chained to {ptag} manifest sha256={digest}")
              return digest

          prev_digest = previous_manifest_digest(version)

          packs = []
          for p in sorted(glob.glob(os.path.join(root, "bootstrap", "*.jsonl"))):
              name = os.path.relpath(p, root)
              packs.append({"name": name, "sha256": sha256(p),
                            "size": os.path.getsize(p)})
          manifest = {
              "_type": "attestarc-knowledge-manifest", "spec_version": "1.0",
              "version": version, "created_at": created, "expires": expires,
              "prev_digest": prev_digest, "mode": "signed", "packs": packs,
          }
          with open(os.path.join(root, "manifest.json"), "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(f"built manifest version={version} expires={expires} "
                f"packs={len(packs)} prev_digest={prev_digest}")
          PY

      - name: Package the bundle
        run: |
          tar -czf "knowledge-${{ github.ref_name }}.tar.gz" \
            knowledge/manifest.json knowledge/bootstrap

      - name: Attest the manifest and the archive (Sigstore build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Attest BOTH the manifest and the .tar.gz so the archive is verifiable
          # before extraction — the client verifies the archive's provenance prior
          # to safe-extract, then re-verifies the manifest + pack integrity.
          subject-path: |
            knowledge/manifest.json
            knowledge-${{ github.ref_name }}.tar.gz

      - name: Self-verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail-secure: refuse to publish anything whose own attestation does not
          # verify under this repo's identity AND the exact triggering ref. Binding
          # the ref (not just --signer-workflow's path match) mirrors the client's
          # cert_identity_regexp check in knowledge/trust-anchor.json.
          IDENTITY="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-knowledge.yml@${{ github.ref }}"
          for artifact in knowledge/manifest.json "knowledge-${{ github.ref_name }}.tar.gz"; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --cert-identity "$IDENTITY" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          done

      - name: Publish knowledge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "knowledge-${{ github.ref_name }}.tar.gz" \
            --title "Knowledge ${{ github.ref_name }}" \
            --notes "Attested knowledge plane. Verify with 'gh attestation verify' against repo ${{ github.repository }}, workflow release-knowledge.yml, issuer https://token.actions.githubusercontent.com. Install with scripts/knowledge_verify.py verify-download."

  revoke:
    # A revocation (kill switch) is produced ONLY by a workflow_dispatch on main with
    # a non-empty revoke_version — never by a tag push. Its attestation is verified
    # by clients against cert_identity_regexp_revocation (@refs/heads/main).
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.revoke_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bind to reviewed history (ancestry gate)
        run: |
          # A revocation is dispatched from a branch; require that branch commit to
          # be contained in origin/main so the kill switch cannot be minted from an
          # unreviewed ref.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::commit $GITHUB_SHA is not contained in origin/main; refusing to sign a revocation from an unreviewed ref"
            exit 1
          fi

      - name: Build revocation record
        env:
          REVOKE_VERSION: ${{ github.event.inputs.revoke_version }}
        run: |
          # A revocation tells clients to disable the named version, roll back to
          # the last-known-good snapshot, and mark every finding assessed under the
          # revoked knowledge as requires_reverification (state.py reverify
          # re-observes the actual condition — a revocation never silently resolves
          # a finding). It is attested exactly like a bundle, so a forged/unsigned
          # revocation cannot drive the kill switch.
          python3 - <<'PY'
          import json, os, datetime
          rec = {
              "_type": "attestarc-knowledge-revocation",
              # revoked_versions is a non-empty list of positive ints — the shape
              # knowledge_verify._validate_revocation / verify_and_apply_revocation
              # require. A single dispatch revokes one version: [N].
              "revoked_versions": [int(os.environ["REVOKE_VERSION"])],
              "revoked_at": datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "action": "disable-version; fall back to last-known-good; mark "
                        "dependent findings requires_reverification",
          }
          with open("revocation.json", "w") as fh:
              json.dump(rec, fh, indent=2)
          PY

      - name: Attest the revocation (Sigstore build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: revocation.json

      - name: Self-verify and publish revocation (kill switch)
        env:
          GH_TOKEN: ${{ github.token }}
          REVOKE_VERSION: ${{ github.event.inputs.revoke_version }}
        run: |
          IDENTITY="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-knowledge.yml@${{ github.ref }}"
          gh attestation verify revocation.json \
            --repo "${{ github.repository }}" \
            --cert-identity "$IDENTITY" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          gh release create "knowledge-revocation-${REVOKE_VERSION}" \
            revocation.json \
            --title "Knowledge revocation v${REVOKE_VERSION}" \
            --notes "KILL SWITCH: knowledge version ${REVOKE_VERSION} is revoked. The revocation is Sigstore-attested; clients verify it, disable the version, roll back to last-known-good, and re-verify dependent findings."
