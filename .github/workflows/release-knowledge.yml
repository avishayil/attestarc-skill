# Knowledge-plane release + attestation (root-of-trust workflow).
#
# Builds knowledge/manifest.json over knowledge/bootstrap/*.jsonl (monotonic
# version + short TTL, pinning every pack by sha256+size), then attests the
# manifest with GitHub Artifact Attestations (Sigstore build provenance, OIDC).
# The attestation binds the bundle to THIS repo + workflow + issuer — the identity
# scripts/knowledge_verify.py pins in knowledge/trust-anchor.json. There is no
# maintainer signing key and no homemade role-file protocol: trust derives from
# Sigstore provenance, verified locally via `gh attestation verify`.
#
# This workflow is itself a ROOT-OF-TRUST artifact: any change is two-party review
# (core/promotion-policy.md, THREAT_MODEL.md §6). Third-party actions are pinned to
# a full commit SHA. The manifest is self-verified with `gh attestation verify`
# before publishing — it never publishes something it could not verify (fail-secure,
# never sign/publish-then-trust).
#
# NOTE: actions/attest-build-provenance below MUST be pinned to a full commit SHA
# (matching the maintainer's chosen release) before this workflow is enabled; the
# two-party review that gates changes to this file is where that pin is set.

name: release-knowledge

on:
  push:
    tags: ["knowledge-v*"]
  workflow_dispatch:
    inputs:
      revoke_version:
        description: "Publish a revocation for this knowledge version (kill switch). Leave empty for a normal release."
        required: false
        default: ""

# Least privilege. id-token:write is required for Sigstore/OIDC provenance;
# attestations:write records the attestation; contents:write publishes the asset.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-publish:
    if: ${{ github.event.inputs.revoke_version == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build manifest over the packs
        run: |
          python3 - <<'PY'
          import hashlib, json, os, glob, datetime
          root = "knowledge"
          ref = os.environ.get("GITHUB_REF_NAME", "")
          version = int(ref.split("knowledge-v")[-1]) if "knowledge-v" in ref else 1
          now = datetime.datetime.now(datetime.timezone.utc)
          created = now.strftime("%Y-%m-%dT00:00:00Z")
          # Short TTL (90 days): a frozen download past this is rejected by the
          # client (freeze protection); the in-package snapshot only warns.
          expires = (now + datetime.timedelta(days=90)).strftime("%Y-%m-%dT00:00:00Z")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  h.update(fh.read())
              return h.hexdigest()

          packs = []
          for p in sorted(glob.glob(os.path.join(root, "bootstrap", "*.jsonl"))):
              name = os.path.relpath(p, root)
              packs.append({"name": name, "sha256": sha256(p),
                            "size": os.path.getsize(p)})
          manifest = {
              "_type": "attestarc-knowledge-manifest", "spec_version": "1.0",
              "version": version, "created_at": created, "expires": expires,
              # prev_digest chains to the previous release's manifest when a prior
              # LKG exists client-side; the primary anti-rollback is the client's
              # monotonic highest-version memory. null on the first release.
              "prev_digest": None, "mode": "signed", "packs": packs,
          }
          with open(os.path.join(root, "manifest.json"), "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(f"built manifest version={version} expires={expires} packs={len(packs)}")
          PY

      - name: Attest the manifest (Sigstore build provenance)
        uses: actions/attest-build-provenance@v2 # MUST pin to a full commit SHA before enabling
        with:
          subject-path: knowledge/manifest.json

      - name: Package the bundle
        run: |
          tar -czf "knowledge-${{ github.ref_name }}.tar.gz" \
            knowledge/manifest.json knowledge/bootstrap

      - name: Self-verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail-secure: refuse to publish a manifest whose own attestation does
          # not verify under this repo's identity.
          gh attestation verify knowledge/manifest.json \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-knowledge.yml"

      - name: Publish knowledge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "knowledge-${{ github.ref_name }}.tar.gz" \
            --title "Knowledge ${{ github.ref_name }}" \
            --notes "Attested knowledge plane. Verify with 'gh attestation verify' against repo ${{ github.repository }}, workflow release-knowledge.yml, issuer https://token.actions.githubusercontent.com. Install with scripts/knowledge_verify.py verify-download."

  revoke:
    if: ${{ github.event.inputs.revoke_version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build revocation record
        env:
          REVOKE_VERSION: ${{ github.event.inputs.revoke_version }}
        run: |
          # A revocation tells clients to disable the named version, roll back to
          # the last-known-good snapshot, and mark every finding assessed under the
          # revoked knowledge as requires_reverification (state.py reverify
          # re-observes the actual condition — a revocation never silently resolves
          # a finding). It is attested exactly like a bundle, so a forged/unsigned
          # revocation cannot drive the kill switch.
          python3 - <<'PY'
          import json, os, datetime
          rec = {
              "_type": "attestarc-knowledge-revocation",
              "revoked_version": int(os.environ["REVOKE_VERSION"]),
              "revoked_at": datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "action": "disable-version; fall back to last-known-good; mark "
                        "dependent findings requires_reverification",
          }
          with open("revocation.json", "w") as fh:
              json.dump(rec, fh, indent=2)
          PY

      - name: Attest the revocation (Sigstore build provenance)
        uses: actions/attest-build-provenance@v2 # MUST pin to a full commit SHA before enabling
        with:
          subject-path: revocation.json

      - name: Self-verify and publish revocation (kill switch)
        env:
          GH_TOKEN: ${{ github.token }}
          REVOKE_VERSION: ${{ github.event.inputs.revoke_version }}
        run: |
          gh attestation verify revocation.json \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-knowledge.yml"
          gh release create "knowledge-revocation-${REVOKE_VERSION}" \
            revocation.json \
            --title "Knowledge revocation v${REVOKE_VERSION}" \
            --notes "KILL SWITCH: knowledge version ${REVOKE_VERSION} is revoked. The revocation is Sigstore-attested; clients verify it, disable the version, roll back to last-known-good, and re-verify dependent findings."
